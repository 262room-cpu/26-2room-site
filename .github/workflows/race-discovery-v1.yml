name: 26.2 ROOM Race Discovery v1

on:
  push:
    branches:
      - agent/race-discovery-v1
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'

permissions:
  contents: write

concurrency:
  group: race-discovery-v1-${{ github.ref }}
  cancel-in-progress: true

env:
  # Production admin catalog discovered from pro.26-2room.com/admin/events.
  # Host/select are public request metadata; only the publishable/anon key is secret.
  APP_SUPABASE_URL: https://ma.26-2room.com
  APP_SUPABASE_EVENTS_RESOURCE: events_with_stats
  APP_SUPABASE_EVENTS_SELECT: '*,country:countries(id,name,code),city:cities(id,name,country_id)'
  APP_SUPABASE_ANON_KEY: ${{ secrets.APP_SUPABASE_ANON_KEY }}
  APP_SUPABASE_BEARER_TOKEN: ${{ secrets.APP_SUPABASE_BEARER_TOKEN }}
  # Generic admin GET remains as a fallback for future backend changes.
  APP_ADMIN_CATALOG_URL: ${{ vars.APP_ADMIN_CATALOG_URL }}
  APP_ADMIN_CATALOG_ITEMS_PATH: ${{ vars.APP_ADMIN_CATALOG_ITEMS_PATH }}
  APP_ADMIN_CATALOG_BEARER_TOKEN: ${{ secrets.APP_ADMIN_CATALOG_BEARER_TOKEN }}
  APP_ADMIN_CATALOG_API_KEY: ${{ secrets.APP_ADMIN_CATALOG_API_KEY }}
  APP_ADMIN_CATALOG_API_KEY_HEADER: ${{ vars.APP_ADMIN_CATALOG_API_KEY_HEADER }}
  # Private organizer CRM is staged only in /tmp on the ephemeral runner.
  PRIVATE_RUNTIME: '1'
  ORGANIZER_CRM_FILE: /tmp/organizer_crm.json
  ORGANIZER_CRM_ZLIB_B64: ${{ secrets.ORGANIZER_CRM_ZLIB_B64 }}

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: race-discovery
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/race-discovery-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Deterministic tests first
        run: python -m unittest discover -s tests -v

      - name: Prepare private organizer CRM
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import zlib

          path = pathlib.Path('/tmp/organizer_crm.json')
          payload = os.environ.get('ORGANIZER_CRM_ZLIB_B64', '').strip()
          if not payload:
              path.write_text('[]', encoding='utf-8')
              print('Private organizer CRM secret not configured; continuing without CRM.')
          else:
              raw = zlib.decompress(base64.b64decode(payload))
              rows = json.loads(raw.decode('utf-8'))
              if not isinstance(rows, list):
                  raise SystemExit('Organizer CRM payload must decode to a JSON list')
              path.write_text(json.dumps(rows, ensure_ascii=False), encoding='utf-8')
              print(f'Private organizer CRM prepared: {len(rows)} rows')
          PY

      - name: Multi-market discovery rotation
        env:
          MARKETS_PER_RUN: '5'
          MARKET_MAX_QUERIES: '16'
          MARKET_RESULTS_PER_QUERY: '7'
          MARKET_MAX_URLS: '45'
          MARKET_TIMEOUT_SECONDS: '300'
          MULTI_MARKET_BUDGET_SECONDS: '1200'
        run: python -m race_agent.market_runner --limit 5

      - name: Quarantine historical parser artifacts
        run: python -m race_agent.hygiene --all

      - name: Organizer contact discovery
        env:
          ORGANIZER_RESEARCH_MARKETS: '5'
          ORGANIZER_RESEARCH_TASKS: '5'
          ORGANIZER_RESEARCH_QUERIES: '2'
          ORGANIZER_RESEARCH_RESULTS: '5'
        run: python -m race_agent.organizer_research --max-markets 5 --max-tasks 5 --queries-per-task 2 --results-per-query 5

      - name: Build 26.2 ROOM action report
        run: python -m race_agent.report --max-items 50

      - name: Remove private CRM staging file
        if: always()
        shell: bash
        run: rm -f /tmp/organizer_crm.json

      - name: Persist checkpoints, evidence and global index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "262room-race-agent"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/
          if git diff --cached --quiet; then
            echo "No runtime changes"
            exit 0
          fi
          git commit -m "[skip ci] agent: persist multi-market discovery checkpoint"

          for attempt in 1 2 3; do
            git fetch origin agent/race-discovery-v1
            if git rebase origin/agent/race-discovery-v1; then
              if git push origin HEAD:agent/race-discovery-v1; then
                echo "Checkpoint persisted on attempt ${attempt}"
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep $((attempt * 2))
          done

          echo "Checkpoint could not be persisted after 3 attempts"
          exit 1
