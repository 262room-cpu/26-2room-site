name: 26.2 ROOM Race Discovery v1

on:
  push:
    branches:
      - agent/race-discovery-v1
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'

permissions:
  contents: write

concurrency:
  group: race-discovery-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: race-discovery
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/race-discovery-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Deterministic tests first
        run: python -m unittest discover -s tests -v

      - name: Multi-market discovery rotation
        env:
          MARKETS_PER_RUN: '5'
          MARKET_MAX_QUERIES: '16'
          MARKET_RESULTS_PER_QUERY: '7'
          MARKET_MAX_URLS: '45'
          MARKET_TIMEOUT_SECONDS: '420'
        run: python -m race_agent.market_runner --limit 5

      - name: Persist checkpoints, evidence and global index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "262room-race-agent"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/
          if git diff --cached --quiet; then
            echo "No runtime changes"
            exit 0
          fi
          git commit -m "[skip ci] agent: persist multi-market discovery checkpoint"
          git push origin HEAD:agent/race-discovery-v1
