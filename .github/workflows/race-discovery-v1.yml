name: 26.2 ROOM Race Discovery v1

on:
  push:
    branches:
      - agent/race-discovery-v1
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'

permissions:
  contents: write

concurrency:
  group: race-discovery-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: race-discovery
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/race-discovery-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Deterministic tests first
        run: python -m unittest discover -s tests -v

      - name: Kazakhstan discovery loop
        env:
          MAX_QUERIES: '10'
          RESULTS_PER_QUERY: '6'
          MAX_URLS: '40'
        run: python -m race_agent.cli run --country kz

      - name: Persist checkpoint and evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "262room-race-agent"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/
          if git diff --cached --quiet; then
            echo "No runtime changes"
            exit 0
          fi
          git commit -m "[skip ci] agent: persist race discovery checkpoint"
          git push origin HEAD:agent/race-discovery-v1
